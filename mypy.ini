[mypy]
python_version = 3.12
plugins = pydantic.mypy
warn_unused_configs = True
show_error_codes = True
namespace_packages = True
explicit_package_bases = True
mypy_path = packages/core/src:packages/converters/src:packages/mcp/src:apps/api/src:apps/fetch-node/src

[mypy-ezmd.*]
strict = True

[mypy-magic.*,brotli.*,brotlicffi.*,magika.*,rq.*,fakeredis.*,charset_normalizer.*,mdit_py_plugins.*]
ignore_missing_imports = True
