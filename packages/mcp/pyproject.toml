[project]
name = "intomd-mcp"
version = "0.0.1"
description = "MCP server for intomd (Phase 1)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["intomd"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intomd_mcp"]
