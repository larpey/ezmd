[project]
name = "ezmd-mcp"
version = "0.1.0rc3"
description = "MCP server for ezmd: convert files, URLs and text to LLM-ready Markdown from any MCP client."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ezmd contributors" }]
dependencies = [
    "ezmd==0.1.0rc3",
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
    "starlette>=0.48",
    "uvicorn>=0.31",
]


[project.urls]
Homepage = "https://github.com/larpey/ezmd"
Documentation = "https://github.com/larpey/ezmd/tree/main/docs"
Repository = "https://github.com/larpey/ezmd"
Issues = "https://github.com/larpey/ezmd/issues"
Changelog = "https://github.com/larpey/ezmd/blob/main/CHANGELOG.md"
[project.scripts]
ezmd-mcp = "ezmd_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmd_mcp"]
