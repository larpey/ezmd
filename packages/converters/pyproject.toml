[project]
name = "intomd-converters"
version = "0.0.1"
description = "Built-in converter families for intomd."
requires-python = ">=3.12"
license = "Apache-2.0"
# Imports `intomd` at runtime; the dependency is declared by `intomd` itself to avoid a
# metadata cycle (see DECISIONS.md D-0003).
dependencies = [
    "charset-normalizer>=3.4",
    "defusedxml>=0.7.1",
    "lxml>=6.1.3",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "openpyxl>=3.1",
    "striprtf>=0.0.26",
    "pathspec>=0.12.1",
    "pikepdf>=10.0,<11",
    "pypdfium2>=5.0,<6",
    "pyyaml>=6.0",
    "trafilatura>=2.3.1,<3",
]

[project.optional-dependencies]
# 7z archives (docs/spec/part2.md section 12): py7zr is LGPL-2.1-or-later, used unmodified as a separate
# package (dynamic use), kept out of the default install as the spec requires.
7z = ["py7zr>=1.1,<2"]
# Docling layout engine for PDF (docs/spec/part4.md 4.3.3); pulls torch, ~1.2 GB. docling-slim with only the
# PDF pipeline extras: the full `docling` meta-package also pins typer<0.27 and websockets<17 (its CLI and
# service client), which would downgrade the default install's CLI dependencies in the universal lock.
# opencv-python-headless (Apache-2.0) is imported by Docling's TableFormer; the full `docling` gets it via RapidOCR.
docs = ["docling-slim[format-pdf,models-local,convert-core]>=2.135,<3", "opencv-python-headless>=4.10"]
# Parquet (data.parquet). pyarrow is Apache-2.0 but ~50 MB per wheel, too big for the default install
# budget (docs/spec/part4.md 4.3.3); see docs/decisions/P1-T05-data.md.
data = ["pyarrow>=17.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intomd_converters"]
