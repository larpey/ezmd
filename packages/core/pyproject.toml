[project]
name = "intomd"
version = "0.1.0rc1"
description = "Convert anything to LLM-ready Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "intomd contributors" }]
dependencies = [
    "intomd-converters==0.1.0rc1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "magika>=0.6",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "rapidfuzz>=3.10",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "markdown-it-py>=3.0",
]


[project.urls]
Homepage = "https://github.com/larpey/intomd"
Documentation = "https://github.com/larpey/intomd/tree/main/docs"
Repository = "https://github.com/larpey/intomd"
Issues = "https://github.com/larpey/intomd/issues"
Changelog = "https://github.com/larpey/intomd/blob/main/CHANGELOG.md"
[project.optional-dependencies]
# docs/spec/part4.md 4.3.3: users install `intomd[<extra>]`; the converter extras live on intomd-converters
# (D-0003), so intomd forwards them. media, ocr, web and fetch arrive with their phases; server needs intomd-api,
# which is not published yet.
docs = ["intomd-converters[docs]"]
data = ["intomd-converters[data]"]
7z = ["intomd-converters[7z]"]
mcp = ["intomd-mcp"]
all = ["intomd-converters[docs,data,7z]", "intomd-mcp"]
# Forbidden licenses (GPL extract-msg); never part of `all` (docs/spec/part4.md 4.3.3).
nonfree = ["intomd-converters[nonfree]"]

[project.scripts]
intomd = "intomd.cli:app"
intomd-score = "intomd.testing.cli:score"
intomd-golden = "intomd.testing.cli:golden"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intomd"]
