[project]
name = "intomd"
version = "0.0.1"
description = "Convert anything to LLM-ready Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "intomd contributors" }]
dependencies = [
    "intomd-converters",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "magika>=0.6",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "rapidfuzz>=3.10",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "markdown-it-py>=3.0",
]

[project.scripts]
intomd = "intomd.cli:app"
intomd-score = "intomd.testing.cli:score"
intomd-golden = "intomd.testing.cli:golden"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intomd"]
