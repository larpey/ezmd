[project]
name = "ezmd"
version = "0.1.0rc3"
description = "Convert anything to LLM-ready Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ezmd contributors" }]
dependencies = [
    "ezmd-converters==0.1.0rc3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "magika>=0.6",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "rapidfuzz>=3.10",
    "typer>=0.15",
    "rich>=13.9",
    # Capped below 1: httpx 1.0 pre-releases dropped httpcore, which ezmd.core.netguard imports directly,
    # and `pip install --pre ezmd` would otherwise resolve them.
    "httpx>=0.28,<1",
    "httpcore>=1.0.9,<2",
    "markdown-it-py>=3.0",
]


[project.urls]
Homepage = "https://github.com/larpey/ezmd"
Documentation = "https://github.com/larpey/ezmd/tree/main/docs"
Repository = "https://github.com/larpey/ezmd"
Issues = "https://github.com/larpey/ezmd/issues"
Changelog = "https://github.com/larpey/ezmd/blob/main/CHANGELOG.md"
[project.optional-dependencies]
# docs/spec/part4.md 4.3.3: users install `ezmd[<extra>]`; the converter extras live on ezmd-converters
# (D-0003), so ezmd forwards them. media, ocr, web and fetch arrive with their phases; server needs ezmd-api,
# which is not published yet.
docs = ["ezmd-converters[docs]"]
data = ["ezmd-converters[data]"]
7z = ["ezmd-converters[7z]"]
# ezmd-mcp is pinned exactly like ezmd-converters (tools/bump_version.py keeps both pins in step).
mcp = ["ezmd-mcp==0.1.0rc3"]
all = ["ezmd-converters[docs,data,7z]", "ezmd-mcp==0.1.0rc3"]
# Forbidden licenses (GPL extract-msg); never part of `all` (docs/spec/part4.md 4.3.3).
nonfree = ["ezmd-converters[nonfree]"]

[project.scripts]
ezmd = "ezmd.cli:app"
ezmd-score = "ezmd.testing.cli:score"
ezmd-golden = "ezmd.testing.cli:golden"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmd"]
