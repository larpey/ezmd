# Office family thresholds (docs/spec/part2.md 2g). Overall golden score minimums per converter.
# DOCX/PPTX/XLSX follow the spec's 0.95+ sub-score targets; ODF uses the no-LibreOffice fallback
# allowance (0.9) and RTF is a plain-text fallback (0.9).
[converters]
"documents.docx" = 0.95
"documents.pptx" = 0.95
"documents.xlsx" = 0.95
"documents.odf" = 0.9
"documents.rtf" = 0.9
