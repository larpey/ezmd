<body><article><h1>Правила причала</h1><p>Швартуйтесь только к своим кольцам. Не оставляйте мусор на понтоне. Топливо выдаётся с восьми до восьми.</p><p>Капитан порта дежурит на шестнадцатом канале.</p></article></body></html>
