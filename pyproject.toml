[project]
name = "ezmd-workspace"
version = "0.0.0"
description = "ezmd monorepo workspace root (not published)"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/converters", "packages/mcp", "apps/api", "apps/fetch-node"]

[tool.uv.sources]
ezmd = { workspace = true }
ezmd-converters = { workspace = true }
ezmd-api = { workspace = true }
ezmd-mcp = { workspace = true }
ezmd-fetch-node = { workspace = true }

[dependency-groups]
dev = [
    "ezmd",
    "ezmd-converters",
    "ezmd-api",
    "ezmd-mcp",
    "ezmd-fetch-node",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-swagger-ui-tag>=0.7",
    "fakeredis>=2.26",
    # Builds decks in tests (test_office_pptx_xlsx.py) and fixtures/office/_generate.py; MIT. Dev only: the
    # pptx converter reads the XML with lxml (docs/decisions/P1-T01-office.md).
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
addopts = "-p ezmd.testing.pytest_fixtures"
testpaths = ["packages", "apps", "tests", "fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: test needs real network access (skipped unless EZMD_NETWORK_TESTS=1)",
    "slow: slow test",
]
