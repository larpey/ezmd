# Per-package license decisions for tools/license_check.py.
#
# Use only when package metadata is missing or ambiguous (e.g. the bare "BSD License"
# classifier) and a human has read the actual license file. Every entry needs:
#   license  SPDX expression the file was verified to contain
#   url      link to the license file at the pinned version (tag or commit, not a branch)
#   version  optional; when set the override only applies to that exact version
#   note     what was checked
# Never use an override to relabel a license the allowlist rejects; change the dependency or
# record a policy decision in DECISIONS.md instead.

[packages.colorama]
license = "BSD-3-Clause"
version = "0.4.6"
url = "https://github.com/tartley/colorama/blob/0.4.6/LICENSE.txt"
note = "Metadata only has the ambiguous 'BSD License' classifier; LICENSE.txt is the 3-clause text (non-endorsement clause present). Windows-only dependency of click/rich."

[packages.justext]
license = "BSD-2-Clause"
version = "3.0.2"
url = "https://github.com/miso-belica/jusText/blob/v3.0.2/LICENSE.rst"
note = "Metadata says 'The BSD 2-Clause License' (not an SPDX id); LICENSE.rst has the two redistribution clauses and no non-endorsement clause. Dependency of trafilatura (P1-T02)."

[packages.pypdfium2]
license = "BSD-3-Clause OR Apache-2.0"
version = "5.14.0"
url = "https://github.com/pypdfium2-team/pypdfium2/tree/5.14.0/LICENSES"
note = "Metadata License field is free text ('BSD-3-Clause, Apache-2.0, dependency licenses'). The wheel ships LICENSES/BSD-3-Clause.txt and LICENSES/Apache-2.0.txt (dual license for pypdfium2 code) plus BUILD_LICENSES for the bundled PDFium (BSD-3-Clause) and its permissive third-party libraries (freetype FTL, libjpeg-turbo IJG/BSD, lcms MIT, openjpeg BSD-2, libpng, zlib, ICU, abseil Apache-2.0)."

[packages.olefile]
license = "BSD-2-Clause"
version = "0.47"
url = "https://github.com/decalage2/olefile/blob/v0.47/LICENSE.txt"
note = "Metadata only has the ambiguous 'BSD License' classifier; LICENSE.txt has the two redistribution clauses and no non-endorsement clause. Default MSG reader for comms.msg (P1-T04)."

# The entries below surfaced when the gate started covering every extra except nonfree (audit-fix-packaging).
# torch (docs extra) pulls jinja2, sympy, mpmath; docling pulls torchvision and transformers; py7zr (7z extra)
# pulls pycryptodomex.

[packages.jinja2]
license = "BSD-3-Clause"
version = "3.1.6"
url = "https://github.com/pallets/jinja/blob/3.1.6/LICENSE.txt"
note = "Metadata only has the ambiguous 'BSD License' classifier; LICENSE.txt is the 3-clause text (non-endorsement clause present). Dependency of torch (docs extra)."

[packages.mpmath]
license = "BSD-3-Clause"
version = "1.3.0"
url = "https://github.com/mpmath/mpmath/blob/1.3.0/LICENSE"
note = "Metadata says 'BSD'; LICENSE is the 3-clause text (clause c, non-endorsement). Dependency of sympy (docs extra)."

[packages.sympy]
license = "BSD-3-Clause AND MIT"
version = "1.14.0"
url = "https://github.com/sympy/sympy/blob/sympy-1.14.0/LICENSE"
note = "Metadata says 'BSD'. LICENSE: SymPy, the Diofant patches, the multipledispatch and PyDy submodules are 3-clause BSD; sympy/parsing/latex (from latex2sympy) is MIT. Dependency of torch (docs extra)."

[packages.torchvision]
license = "BSD-3-Clause"
version = "0.29.1"
url = "https://github.com/pytorch/vision/blob/v0.29.1/LICENSE"
note = "Metadata says 'BSD' with no classifier; LICENSE is the 3-clause text. Dependency of docling (docs extra)."

[packages.transformers]
license = "Apache-2.0"
version = "5.19.0"
url = "https://github.com/huggingface/transformers/blob/v5.19.0/LICENSE"
note = "Metadata says 'Apache 2.0 License' (not mapped); LICENSE is the Apache License 2.0 text. Dependency of docling (docs extra). Model weights are a separate check (model_licenses)."

[packages.pycryptodomex]
license = "BSD-2-Clause AND Unlicense"
version = "3.24.0"
url = "https://github.com/Legrandin/pycryptodome/blob/v3.24.0/LICENSE.rst"
note = "Metadata says 'BSD, Public Domain'. LICENSE.rst: code from PyCrypto is public domain under the verbatim Unlicense text (it links unlicense.org); direct contributions are BSD 2-clause (no non-endorsement clause). Dependency of py7zr (7z extra)."
