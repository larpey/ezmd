# Per-package license decisions for tools/license_check.py.
#
# Use only when package metadata is missing or ambiguous (e.g. the bare "BSD License"
# classifier) and a human has read the actual license file. Every entry needs:
#   license  SPDX expression the file was verified to contain
#   url      link to the license file at the pinned version (tag or commit, not a branch)
#   version  optional; when set the override only applies to that exact version
#   note     what was checked
# Never use an override to relabel a license the allowlist rejects; change the dependency or
# record a policy decision in DECISIONS.md instead.

[packages.colorama]
license = "BSD-3-Clause"
version = "0.4.6"
url = "https://github.com/tartley/colorama/blob/0.4.6/LICENSE.txt"
note = "Metadata only has the ambiguous 'BSD License' classifier; LICENSE.txt is the 3-clause text (non-endorsement clause present). Windows-only dependency of click/rich."

[packages.justext]
license = "BSD-2-Clause"
version = "3.0.2"
url = "https://github.com/miso-belica/jusText/blob/v3.0.2/LICENSE.rst"
note = "Metadata says 'The BSD 2-Clause License' (not an SPDX id); LICENSE.rst has the two redistribution clauses and no non-endorsement clause. Dependency of trafilatura (P1-T02)."

[packages.pypdfium2]
license = "BSD-3-Clause OR Apache-2.0"
version = "5.14.0"
url = "https://github.com/pypdfium2-team/pypdfium2/tree/5.14.0/LICENSES"
note = "Metadata License field is free text ('BSD-3-Clause, Apache-2.0, dependency licenses'). The wheel ships LICENSES/BSD-3-Clause.txt and LICENSES/Apache-2.0.txt (dual license for pypdfium2 code) plus BUILD_LICENSES for the bundled PDFium (BSD-3-Clause) and its permissive third-party libraries (freetype FTL, libjpeg-turbo IJG/BSD, lcms MIT, openjpeg BSD-2, libpng, zlib, ICU, abseil Apache-2.0)."

[packages.olefile]
license = "BSD-2-Clause"
version = "0.47"
url = "https://github.com/decalage2/olefile/blob/v0.47/LICENSE.txt"
note = "Metadata only has the ambiguous 'BSD License' classifier; LICENSE.txt has the two redistribution clauses and no non-endorsement clause. Default MSG reader for comms.msg (P1-T04)."
