# GPU override (docs/spec/part4.md 4.9.3). Phase 2 fills in the worker-media image and queues.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile media up -d
# Requires the NVIDIA Container Toolkit on the host. Without `--profile media` nothing changes.
services:
  worker-media:
    extends:
      file: docker-compose.yml
      service: worker-default
    profiles: ["media"]
    image: ghcr.io/larpey/ezmd-worker-media-cuda:${EZMD_VERSION:-latest}
    build: !reset null
    command: ["python", "-m", "ezmd_api.worker", "--queues", "media"]
    tmpfs:
      - /tmp:size=${EZMD_MEDIA_TMPFS_SIZE:-6g},mode=1777
    environment:
      EZMD_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: ${EZMD_GPU_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          cpus: "${EZMD_WORKER_MEDIA_CPUS:-3.0}"
          memory: ${EZMD_WORKER_MEDIA_MEM:-12g}
          pids: 256
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: ${EZMD_GPU_COUNT:-1}
              capabilities: [gpu]
