[project]
name = "ezmd-api"
version = "0.1.0rc1"
description = "ezmd HTTP API and RQ workers."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ezmd",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "redis>=5.2",
    "rq>=2.0",
    "python-multipart>=0.0.18",
    "pyjwt>=2.10",
    "typer>=0.15",
]

[project.scripts]
ezmd-admin = "ezmd_api.admin:main"

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmd_api"]
