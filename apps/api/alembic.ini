# Alembic config for the ezmd API. Run from apps/api: `uv run alembic upgrade head`.
# The database URL comes from EZMD_DATABASE_URL (see ezmd_api/migrations/env.py).
[alembic]
script_location = ezmd_api:migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
