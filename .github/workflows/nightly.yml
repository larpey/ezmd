# Nightly (part1.md P0-T12 item 2; part4.md 4.15.3 adapted to Phase 0): rebuild images from
# scratch (fresh base layers), run the golden suite, audit dependencies, open an issue on failure.
name: nightly
on:
  schedule: [{ cron: "23 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_FROZEN: "1"

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true, cache-dependency-glob: uv.lock }
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libmagic1  # pandoc returns with the Office converters (P1-T01)
      - run: uv sync --all-packages
      - run: uv run python tools/check_fixture_provenance.py
      - run: uv run pytest fixtures -q
      - run: uv run pytest packages apps tests -q
      - name: golden scorecard (P1-T19)
        if: always()
        run: |
          uv run python tools/scorecard.py --out "$RUNNER_TEMP/scorecard"
          cat "$RUNNER_TEMP/scorecard/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: scorecard, path: "${{ runner.temp }}/scorecard/", if-no-files-found: warn }

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, fetch-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          pull: true
          tags: ghcr.io/larpey/ezmd-${{ matrix.target }}:nightly
          build-args: EZMD_REQUIRE_WEB=1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/larpey/ezmd-${{ matrix.target }}:nightly
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/smoke.sh --down

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pip-audit
        run: |
          uv export --no-dev --all-packages --format requirements-txt --no-emit-workspace > "$RUNNER_TEMP/req.txt"
          IGNORES="$(uv run --no-project python -c "import tomllib,datetime as d; t=tomllib.load(open('tools/audit_ignore.toml','rb')); print(' '.join('--ignore-vuln '+e['id'] for e in t.get('pip',[]) if d.date.fromisoformat(str(e['expires']))>=d.date.today()))")"
          # shellcheck disable=SC2086
          uvx --from 'pip-audit>=2.7' pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt" $IGNORES
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod
      - name: expired audit ignores
        run: |
          uv run --no-project python - <<'PY'
          import datetime as d, sys, tomllib
          t = tomllib.load(open("tools/audit_ignore.toml", "rb"))
          expired = [e for k in ("pip", "pnpm") for e in t.get(k, []) if d.date.fromisoformat(str(e["expires"])) < d.date.today()]
          for e in expired:
              print(f"::error::audit ignore {e['id']} expired on {e['expires']} ({e.get('issue', 'no issue')})")
          sys.exit(1 if expired else 0)
          PY

  report:
    needs: [goldens, images, smoke, audit]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Nightly failure ${new Date().toISOString().slice(0, 10)}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'nightly' });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title, body: `One or more nightly jobs failed: ${url}`, labels: ['nightly', 'regression'] });
