# Release (docs/spec/part4.md 4.15.4; part1.md P0-T12). Triggered by a version tag.
# Human gate: the PyPI / TestPyPI / npm publish jobs are disabled (`if: false`) until the owner
# configures trusted publishing and the `release` environment approval (STATUS.md "Blocked on
# human"). Image build + GHCR push runs on every tag, including pre-release tags like v0.0.1-rc1.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, fetch-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/larpey/intomd-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            io.modelcontextprotocol.server.name=io.github.larpey/intomd
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INTOMD_REQUIRE_WEB=1
            INTOMD_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
          provenance: true
          sbom: true
      - name: sign (keyless cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          chmod +x "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" sign --yes "ghcr.io/larpey/intomd-${{ matrix.target }}@${DIGEST}"

  python-dist:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [intomd, intomd-converters, intomd-mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --package ${{ matrix.package }} --out-dir dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "dist-${{ matrix.package }}", path: dist/ }

  testpypi:
    # v0.0.* goes to TestPyPI. HUMAN GATE: enable once trusted publishing is configured.
    if: false && startsWith(github.ref_name, 'v0.0.')
    needs: python-dist
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "dist-*", path: dist/, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { repository-url: "https://test.pypi.org/legacy/", packages-dir: dist/ }

  pypi:
    # v0.1.0+ goes to PyPI behind the `release` environment approval. HUMAN GATE.
    if: false && !startsWith(github.ref_name, 'v0.0.')
    needs: python-dist
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "dist-*", path: dist/, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { packages-dir: dist/ }

  npm:
    # HUMAN GATE: enable once the npm package and trusted publishing exist.
    if: false
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org", cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm -F @intomd/sdk build
      - run: pnpm -F @intomd/sdk publish --provenance --access public --no-git-checks

  extension:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: build and zip (skipped until apps/extension has a build script, Phase 3)
        run: |
          mkdir -p dist
          if node -e "process.exit(require('./apps/extension/package.json').scripts?.build ? 0 : 1)"; then
            pnpm -F ./apps/extension build
            for b in chrome firefox; do
              [ -d "apps/extension/dist/$b" ] && (cd apps/extension/dist && zip -qr "../../../dist/intomd-extension-$b-${GITHUB_REF_NAME}.zip" "$b")
            done
          fi
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: extension, path: "dist/*.zip", if-no-files-found: ignore }

  github-release:
    needs: [images, python-dist, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "dist-*", path: dist/, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # no extension zip until Phase 3
        with: { name: extension, path: dist/ }
      - name: changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## / { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || awk '/^## /{n++} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
