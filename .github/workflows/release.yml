# Release (docs/spec/part4.md 4.15.4; P1-T16). Triggered by a version tag pushed by the owner.
#
#   vX.Y.Z-rcN  release candidate: images (GHCR, no :latest), TestPyPI, GitHub pre-release.
#               Never PyPI, npm or the MCP registry.
#   vX.Y.Z      final: images, PyPI, npm, MCP registry, GitHub release.
#
# HUMAN GATES (docs/selfhost.md "Releases"): nothing is published to TestPyPI, PyPI, npm or the MCP
# registry unless (1) the repository variable EZMD_PUBLISH_ENABLED is "true" and (2) the
# `release` environment exists with required reviewers (checked by `publish-gate`; the job fails
# otherwise). Every PyPI/npm/MCP job runs in `environment: release`, so a reviewer must approve each
# final release; TestPyPI uses `environment: testpypi`. Publishing uses OIDC trusted publishing only:
# no API tokens are stored in the repository.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pep440: ${{ steps.v.outputs.pep440 }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: tag matches package versions
        run: python3 tools/release_version.py "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: [preflight, verify]
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}

  python-dist:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [ezmd, ezmd-converters, ezmd-mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --package ${{ matrix.package }} --out-dir dist/
      - name: built version matches the tag
        env:
          PEP440: ${{ needs.preflight.outputs.pep440 }}
        run: |
          ls dist/
          for f in dist/*; do
            case "$f" in *"-${PEP440}"[.-]*) ;; *) echo "::error::$f does not carry version $PEP440"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "dist-${{ matrix.package }}", path: dist/ }

  publish-gate:
    # Decides whether this tag may publish at all. Skips publishing (with a notice) until the owner
    # sets EZMD_PUBLISH_ENABLED=true; fails if it is set but the `release` environment has no
    # required reviewers, so an unprotected environment can never publish.
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLED: ${{ vars.EZMD_PUBLISH_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::EZMD_PUBLISH_ENABLED is not true; skipping TestPyPI/PyPI/npm/MCP publishing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rules="$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[]?.type] | join(",")')" || {
            echo "::error::the release environment does not exist; create it with required reviewers"; exit 1; }
          case ",$rules," in
            *,required_reviewers,*) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the release environment has no required reviewers (rules: $rules)"; exit 1 ;;
          esac

  testpypi:
    # Release candidates only. HUMAN GATE: publish-gate + the testpypi environment.
    if: needs.preflight.outputs.prerelease == 'true' && needs.publish-gate.outputs.enabled == 'true'
    needs: [preflight, publish-gate, python-dist, images]
    runs-on: ubuntu-latest
    # One job per package: a pending trusted publisher (repo + workflow + environment) can be pending for one
    # project at a time, so first releases create the projects one by one; each failed upload re-runs alone.
    strategy:
      fail-fast: false
      matrix:
        package: [ezmd, ezmd-converters, ezmd-mcp]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ matrix.package }}/${{ needs.preflight.outputs.pep440 }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "dist-${{ matrix.package }}", path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { repository-url: "https://test.pypi.org/legacy/", packages-dir: dist/ }

  pypi:
    # Final releases only. HUMAN GATE: publish-gate + required reviewers on `release`.
    if: needs.preflight.outputs.prerelease == 'false' && needs.publish-gate.outputs.enabled == 'true'
    needs: [preflight, publish-gate, python-dist, images]
    runs-on: ubuntu-latest
    # One job per package: a pending trusted publisher (repo + workflow + environment) can be pending for one
    # project at a time, so first releases create the projects one by one; each failed upload re-runs alone.
    strategy:
      fail-fast: false
      matrix:
        package: [ezmd, ezmd-converters, ezmd-mcp]
    environment:
      name: release
      url: https://pypi.org/project/${{ matrix.package }}/${{ needs.preflight.outputs.pep440 }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "dist-${{ matrix.package }}", path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { packages-dir: dist/ }

  npm:
    # Final releases only (npm has no test registry). HUMAN GATE as for pypi. npm trusted publishing
    # (OIDC, npm >= 11.5) with provenance; no NPM_TOKEN.
    if: needs.preflight.outputs.prerelease == 'false' && needs.publish-gate.outputs.enabled == 'true'
    needs: [preflight, publish-gate, verify]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@ezmd/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org", cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm -F @ezmd/sdk build
      - name: publish (trusted publishing)
        working-directory: packages/sdk-ts
        run: npx --yes npm@11.21.0 publish --provenance --access public

  mcp-registry:
    # Final releases only, after PyPI has the package the server.json points at. HUMAN GATE as above.
    if: needs.preflight.outputs.prerelease == 'false' && needs.publish-gate.outputs.enabled == 'true'
    needs: [preflight, publish-gate, pypi]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://registry.modelcontextprotocol.io/
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install mcp-publisher (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mcp.tgz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp.tgz" -C "$RUNNER_TEMP" mcp-publisher
      - name: stamp server.json with the release version
        env:
          PEP440: ${{ needs.preflight.outputs.pep440 }}
        run: |
          jq --arg v "$PEP440" '.version = $v | .packages |= map(.version = $v)' packages/mcp/server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" packages/mcp/server.json
      - run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish packages/mcp/server.json

  extension:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: build and zip (skipped until apps/extension has a build script, Phase 3)
        run: |
          mkdir -p dist
          if node -e "process.exit(require('./apps/extension/package.json').scripts?.build ? 0 : 1)"; then
            pnpm -F ./apps/extension build
            for b in chrome firefox; do
              [ -d "apps/extension/dist/$b" ] && (cd apps/extension/dist && zip -qr "../../../dist/ezmd-extension-$b-${GITHUB_REF_NAME}.zip" "$b")
            done
          fi
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: extension, path: "dist/*.zip", if-no-files-found: ignore }

  github-release:
    # Images, dists, SBOMs and the extension; independent of the gated registry publishes.
    needs: [preflight, images, python-dist, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "dist-*", path: dist/, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "sbom-*", path: dist/, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # no extension zip until Phase 3
        with: { name: extension, path: dist/ }
      - name: checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS)
      - name: changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## / { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || awk '/^## /{n++} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          generate_release_notes: true
