# Release images (docs/spec/part4.md 4.15.4; P1-T16). Called by release.yml for a version tag.
# Per target: build linux/amd64+arm64 and push BY DIGEST ONLY (no tag yet), Trivy-scan that digest
# (HIGH/CRITICAL with a fix fail the release), write an SPDX SBOM with syft, sign the digest with
# cosign keyless (GitHub OIDC -> Fulcio, logged in Rekor) and attach the SBOM as a signed
# attestation. Only then are the version tags pointed at the digest, so no tag ever names an
# unscanned or unsigned image. BuildKit's own provenance and SBOM attestations are pushed as well.
#
# Verify a published image:
#   cosign verify ghcr.io/larpey/intomd-api:1.2.0 \
#     --certificate-identity-regexp '^https://github.com/larpey/intomd/.github/workflows/images.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: images
on:
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v (1.2.0 or 1.2.0-rc1)"
        required: true
        type: string
      prerelease:
        description: "true for release candidates: no :latest or :MAJOR.MINOR tags"
        required: true
        type: boolean
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, worker, fetch-node]
    env:
      IMAGE: ghcr.io/larpey/intomd-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ !inputs.prerelease }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}
            io.modelcontextprotocol.server.name=io.github.larpey/intomd
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            INTOMD_REQUIRE_WEB=1
            INTOMD_VERSION=${{ inputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
          provenance: mode=max
          sbom: true
      - name: trivy (HIGH/CRITICAL with a fix fail the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX JSON, syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: intomd-${{ matrix.target }}-${{ inputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign and attest (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          SBOM: intomd-${{ matrix.target }}-${{ inputs.version }}.spdx.json
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
      - name: tag the scanned, signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          echo "$IMAGE@$DIGEST -> $(echo "$TAGS" | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.target }}
          path: intomd-${{ matrix.target }}-${{ inputs.version }}.spdx.json
