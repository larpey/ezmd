site_name: ezmd
site_url: https://larpey.github.io/ezmd/
site_description: Convert anything to LLM-ready Markdown. No silent loss. Apache-2.0.
repo_url: https://github.com/larpey/ezmd
repo_name: larpey/ezmd
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - swagger-ui-tag

exclude_docs: |
  internal/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - First conversion: quickstart.md
      - Output format: output-format.md
  - Self-host:
      - Self-hosting and configuration: selfhost.md
      - Security model: security.md
  - Interfaces:
      - CLI reference: cli.md
      - Python library: library.md
      - MCP server: mcp.md
  - API:
      - REST API, jobs, and SSE: api.md
      - OpenAPI reference: api-reference.md
      - Errors: errors.md
      - Warning codes: warnings.md
  # BEGIN generated converters nav (tools/gen_converters_matrix.py)
  - Converters:
      - Converter matrix: converters/README.md
      - "Archives": converters/archives.md
      - "Code converters": converters/code.md
      - "Data converters": converters/data.md
      - "Ebooks and notebooks": converters/ebooks.md
      - "Email converters (communication family)": converters/comms.md
      - "Office documents": converters/office.md
      - "PDF converters": converters/pdf.md
      - "Plain text and Markdown": converters/text.md
      - "SEC EDGAR": converters/edgar.md
      - "Social and forums (Phase 1 stub)": converters/social.md
      - "Web pages (web family)": converters/web.md
  # END generated converters nav
  - Contributing:
      - Contributing guide: contributing.md
      - Writing a converter plugin: plugins.md
      - Code of conduct: code-of-conduct.md
  - Project:
      - Security policy: security-policy.md
      - Changelog: changelog.md
      - Roadmap: roadmap.md
      - Licenses: licenses.md
